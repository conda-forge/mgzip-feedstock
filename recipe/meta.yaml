{% set name = "mgzip" %}
{% set version = "0.2.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/mgzip-{{ version }}.tar.gz
  sha256: 37f63c66a9968656825f74ee9fad4f1c7c32b2531b44b8b71d16679cd00d7138

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}

test:
  imports:
    - mgzip
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/vinlyx/mgzip
  summary: A multi-threading implementation of Python gzip module
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jan-janssen
